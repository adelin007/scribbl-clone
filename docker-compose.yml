version: "3.8"
services:
  server:
    build:
      context: ./server
    image: scribbl-server:latest
    restart: unless-stopped
    environment:
      # Read values from .env (defaults provided). Set these in your VPS .env.
      CLIENT_URL: "${CLIENT_URL:-http://localhost}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    networks:
      - scribbl-net

  client:
    build:
      context: ./client
      args:
        # At build time you can inject a socket URL; however the client will default
        # at runtime the client will default to the current origin (recommended)
        # To force a specific socket URL set VITE_SOCKET_URL here during build.
        # Pass build-time override; leave empty to let the client default to runtime origin
        VITE_SOCKET_URL: "${VITE_SOCKET_URL:-}"
    image: scribbl-client:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NODE_ENV: production
      N8N_AUTH_USER: "${N8N_AUTH_USER:-admin}"
      N8N_AUTH_PASSWORD_HASH: "${N8N_AUTH_PASSWORD_HASH}"
    networks:
      - scribbl-net
    volumes:
      - caddy-data:/data
      - caddy-config:/config
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      # Read values from .env (defaults provided). Set these in your VPS .env.
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: "${N8N_PORT:-5678}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_BASIC_AUTH_ACTIVE: "${N8N_BASIC_AUTH_ACTIVE:-false}"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-user}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-password}"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168" # 7 days in hours
      WEBHOOK_URL: "${WEBHOOK_URL}"
      N8N_PROXY_HOPS: "1" # <--- Critical for resolving the protocol error
    networks:
      - scribbl-net
    volumes:
      - n8n-data:/home/node/.n8n

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - scribbl-net

networks:
  scribbl-net:
    driver: bridge

volumes:
  redis-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  n8n-data:
    driver: local
